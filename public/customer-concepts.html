<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer workspace concepts · Owner Admin</title><style>
:root{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#203027;background:#f2f5f2}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #d6a453;outline-offset:2px}.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--brand,#27543a);color:white;position:sticky;top:0;z-index:10}.top strong{flex:1}.top button{background:#ffffff20;border:1px solid #ffffff55;border-radius:6px;color:white;padding:7px 11px}.top select{max-width:52%;border:1px solid #c9d9cb;border-radius:6px;padding:7px;background:white}.overlay{display:none;position:fixed;inset:60px 0 0;background:#0006;z-index:15}.overlay.show{display:block}.side{position:fixed;z-index:16;top:60px;bottom:0;left:0;width:250px;background:#172a25;color:#c7d8cf;padding:18px;transform:translateX(-110%);transition:transform .2s;overflow:auto}.side.show{transform:translateX(0)}.side h3{margin:0 0 18px;color:white}.side button{display:block;width:100%;text-align:left;padding:11px 13px;border:0;background:transparent;color:inherit;border-radius:6px;margin:2px 0}.side button.active,.side button:hover{background:#36594a;color:white}.content{max-width:1100px;margin:auto;padding:24px 20px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#65796c}.heading{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}h1{font-size:27px;margin:0}h2{font-size:17px;margin:0 0 14px}.hint{font-size:13px;color:#627267}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card,.table{background:white;border:1px solid #dbe4dd;border-radius:9px;padding:20px;box-shadow:0 1px 3px #152d1c0b}.metric{font-size:30px;font-weight:700;color:var(--brand,#27543a);display:block;margin:6px 0}.section{margin-top:22px}.table{padding:0;overflow:hidden}.item{display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #e8ede8}.item:last-child{border:0}.pill{font-size:12px;border-radius:5px;background:#e5f1e8;color:#27583b;padding:3px 8px;white-space:nowrap}.notice{border-left:4px solid #bd9651;background:#fffdf6;padding:12px 15px;margin:20px 0;border-radius:5px;font-size:13px}.primary{background:var(--brand,#27543a);color:white;border:0;border-radius:6px;padding:9px 14px}.empty{color:#718277;padding:30px;text-align:center}.footer{font-size:12px;color:#66796b;margin:30px 0}@media(max-width:600px){.content{padding:17px 13px}.top{padding:0 10px}.top select{max-width:47%}h1{font-size:22px}.card{padding:15px}.metric{font-size:25px}}</style></head><body>
<header class="top"><button id="toggle" aria-label="Open navigation" aria-expanded="false">☰ Menu</button><strong id="brand">Customer workspace</strong><select id="template" aria-label="Choose example organisation"><option value="heritage">Heritage attraction</option><option value="charity">Community charity</option><option value="maintenance">Maintenance company</option><option value="visitor">Visitor attraction</option></select></header>
<div class="overlay" id="overlay"></div><aside class="side" id="side"><h3 id="navtitle">Example workspace</h3><nav id="nav"></nav></aside><main class="content"><div class="eyebrow">Interactive design concept · fictional data</div><div class="heading"><div><h1 id="title">Overview</h1><div class="hint" id="subtitle"></div></div><button class="primary" id="reset">Return to overview</button></div><div class="notice">Prototype only. No login, database, customer records or working administrative permissions. Do not enter real information.</div><div id="body"></div><div class="footer">Owner Admin concept showcase · not a production customer website</div></main>
<script>
const configs={
heritage:{name:'Heritage Railway Demo',color:'#28533a',menu:['Overview','Who is on site','Volunteers','Attendance','Events','Maintenance','Assets','Reports','Settings'],stats:[['People on site','12'],['Upcoming events','3'],['Open maintenance jobs','7'],['Volunteer hours this month','184']],rows:[['Track inspection','Due today'],['Steam gala preparation','In progress'],['Volunteer induction','Scheduled']]},
charity:{name:'Community Centre Demo',color:'#426482',menu:['Overview','People','Shifts','Events','Rooms','Tasks','Reports','Settings'],stats:[['Volunteers this week','28'],['Upcoming sessions','9'],['Unfilled shifts','2'],['Open tasks','5']],rows:[['Community lunch','Tomorrow'],['Volunteer rota','2 gaps'],['Room booking','Confirmed']]},
maintenance:{name:'Workshop Services Demo',color:'#5b4b3a',menu:['Overview','Sites','Assets','Work orders','Inspections','Staff','Schedule','Reports','Settings'],stats:[['Open work orders','16'],['Due inspections','4'],['Active sites','3'],['Jobs completed this week','11']],rows:[['Pump inspection','Due today'],['Lighting repair','Assigned'],['Workshop audit','Scheduled']]},
visitor:{name:'Visitor Attraction Demo',color:'#455c70',menu:['Overview','Team','Shifts','Events','Equipment','Checklists','Reports','Settings'],stats:[['Staff scheduled','14'],['Checks due','3'],['Upcoming bookings','8'],['Open incidents','1']],rows:[['Opening checklist','Pending'],['Weekend event','Scheduled'],['Equipment service','Due soon']]}
};
let type='heritage',page='Overview';const $=id=>document.getElementById(id);
function menu(open){$('side').classList.toggle('show',open);$('overlay').classList.toggle('show',open);$('toggle').setAttribute('aria-expanded',String(open))}
$('toggle').onclick=()=>menu(!$('side').classList.contains('show'));$('overlay').onclick=()=>menu(false);
$('template').onchange=e=>{type=e.target.value;page='Overview';render()};$('reset').onclick=()=>{page='Overview';render()};
function render(){const c=configs[type];document.documentElement.style.setProperty('--brand',c.color);$('brand').textContent=c.name;$('navtitle').textContent=c.name;$('title').textContent=page;$('subtitle').textContent=page==='Overview'?'A practical view of daily operations':'Example '+page.toLowerCase()+' module · demonstration only';
$('nav').replaceChildren();c.menu.forEach(name=>{const b=document.createElement('button');b.textContent=name;b.className=name===page?'active':'';b.onclick=()=>{page=name;menu(false);render()};$('nav').append(b)});
const body=$('body');body.replaceChildren();
if(page==='Overview'){const cards=document.createElement('div');cards.className='cards';c.stats.forEach(([label,value])=>{const card=document.createElement('div');card.className='card';const small=document.createElement('div');small.className='hint';small.textContent=label;const metric=document.createElement('span');metric.className='metric';metric.textContent=value;card.append(small,metric);cards.append(card)});body.append(cards);
const section=document.createElement('section');section.className='section';const heading=document.createElement('h2');heading.textContent='Items needing attention';const table=document.createElement('div');table.className='table';c.rows.forEach(([name,status])=>{const row=document.createElement('div');row.className='item';const text=document.createElement('span');text.textContent=name;const pill=document.createElement('span');pill.className='pill';pill.textContent=status;row.append(text,pill);table.append(row)});section.append(heading,table);body.append(section)}
else{const section=document.createElement('section');section.className='card';const heading=document.createElement('h2');heading.textContent=page;const desc=document.createElement('p');desc.textContent='This is a layout placeholder for the '+page.toLowerCase()+' module. The finished version will include searchable records, permission-controlled actions, reporting and appropriate empty and error states.';const empty=document.createElement('div');empty.className='empty';empty.textContent='No live records in this concept';section.append(heading,desc,empty);body.append(section)}
}render();
</script></body></html>
